<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #cc0000;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Video Downloader</h2>
        <p>YouTube video ka link yahan paste karein:</p>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        <br>
        <button onclick="downloadVideo()">Download</button>
        <div id="message"></div>
    </div>

    <script>
        function downloadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const messageDiv = document.getElementById('message');

            if (!url) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'Kripya valid YouTube link dalein!';
                return;
            }

            messageDiv.style.color = 'blue';
            messageDiv.innerText = 'Link fetch ho raha hai, thoda intezaar karein...';

            window.location.href = `/download?url=${encodeURIComponent(url)}`;
        }
    </script>

</body>
</html>
